<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Office Hours</title>

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main>
      <header>
        <h1>Hello, World!</h1>
      </header>

      <nav aria-label="Main navigation">
        <ul>
          <li>
            <a href="#schedule" class="nav-link" aria-current="location">
              Office Hours
            </a>
          </li>

          <li>
            <a href="#feedback" class="nav-link"> Send Feedback </a>
          </li>
        </ul>
      </nav>

      <!-- Office Hours Section -->
      <section id="schedule">
        <h2 id="schedule-heading">Office Hours</h2>

        <fig>
          <table>
            <thead>
              <tr>
                <th>Day</th>
                <th>Time</th>
                <th>Location</th>
              </tr>
            </thead>

            <tbody>
              <tr>
                <td>Monday</td>
                <td>10:00-11:00</td>
                <td>Room 214</td>
              </tr>

              <tr>
                <td>Wednesday</td>
                <td>14:00-15:00</td>
                <td>Room 214</td>
              </tr>
            </tbody>
          </table>

          <figcaption class="text-muted">
            All office hours are held in Room 214.
          </figcaption>
        </fig>
      </section>

      <section id="feedback">
        <h2>Send Feedback</h2>

        <form>
          <p>
            <label for="name">Name</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Enter your name"
              required
            />
          </p>

          <p>
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="example123@gmail.com"
            />
          </p>

          <span class="text-muted">
            We will only use this to reply to you.
          </span>

          <button type="submit">Send</button>
        </form>
      </section>
    </main>
  </body>
</html>
